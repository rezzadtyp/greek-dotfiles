# --- Variables ---
var=terminal,kitty
var=fileManager,pcmanfm
var=browser,/home/blanc/Downloads/helium.appimage
var=music,spotify
var=launcher,fuzzel
var=runner,fuzzel --list-executables-in-path

# --- Environment Variables ---
env=XCURSOR_SIZE,30
env=HYPRCURSOR_SIZE,30
env=QT_QPA_PLATFORMTHEME,qt6ct

# --- Cursor & Misc ---
#cursor_theme=macOS-hypr
cursor_size=24
sloppy_focus=1
allow_tearing=0

# --- Autostart ---
# exec=/home/blanc/.config/mango/autostart.sh
exec=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec=kitty
exec=nm-applet
exec=waybar
exec=swaync
exec=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec=/usr/lib/xdg-desktop-portal-wlr
exec=swaybg -m fill -i /home/blanc/Downloads/wp11291027-greek-aesthetic-pc-wallpapers.jpg

# --- Appearance, Gaps & Borders ---
border_px=2
#gap_inner=4
#gap_outer=12
# gappoh=12
# gappov=12
border_color=0x1e1e1eaa
focus_color=0xfafafaff

# --- Input ---
xkb_rules_layout=us
numlock_on=0
repeat_rate=35
repeat_delay=250
tap_to_click=1
trackpad_natural_scrolling=0

# --- Keybindings ---
# Format: bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS

# Apps & Session
bind=SUPER,q,spawn,$terminal
bind=SUPER,c,killclient,
bind=SUPER,m,quit,
bind=SUPER,f,spawn,$fileManager
bind=SUPER,b,spawn,$browser
bind=SUPER,s,spawn,$music
bind=SUPER,space,spawn,$launcher
bind=SUPER+SHIFT,space,spawn,$runner
bind=SUPER,n,spawn_shell,swaync-client -t -sw
bind=SUPER+SHIFT,r,reload_config,

# Window State & Layout
bind=SUPER,v,togglefloating,
bind=SUPER,p,dwindle_toggle_split_direction,
bind=SUPER,j,switch_layout,
bind=SUPER,Tab,switch_layout,

# Focus & Window Movement (Arrow keys)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# Tags (1-9, and 0)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,0

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,0

# Screenshot
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy

# Volume & Brightness (PageUp = Prior, PageDown = Next)
bind=SUPER+SHIFT,Prior,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=SUPER+SHIFT,Next,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-
bind=SUPER,Prior,spawn,brightnessctl -e4 -n2 set 5%+
bind=SUPER,Next,spawn,brightnessctl -e4 -n2 set 5%-

# Media Keys (requires playerctl)
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Mouse Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Toggle floating on the active window
bind=SUPER,t,togglefloating

# Optional: Toggle floating for all visible windows on the current tag
bind=SUPER+SHIFT,t,toggle_all_floating
